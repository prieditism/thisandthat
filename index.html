<body>

  <section class="hero">
    <div class="stack">
      <div class="typing-line line-1"><span id="line1"></span></div>
      <div class="typing-line line-2"><span id="line2"></span></div>
      <div class="typing-line line-3"><span id="line3"></span></div>
      <div class="typing-line line-4"><span id="line4"></span></div>
      <div class="typing-line line-5"><span id="line5"></span></div>
      <div class="typing-line line-6"><span id="line6"></span></div>

      <div class="gap-large"></div>

      <div class="typing-line line-7"><span id="line7"></span></div>
      <div class="social-gap"></div>
      <div class="typing-line line-8"><span id="line8"></span></div>
    </div>
  </section>

  <div class="scroll-indicator">Scroll</div>

  <script>
    const line1Text = "Mārtiņš Priedītis (Martins Prieditis)";
    const line2Text = "New Media & Creative AI";
    const line3Text = "Human–AI Interaction";
    const line4Text = "Audiovisual Systems Designer";
    const line5Plain = "Founder @reverie™";
    const line5Html = 'Founder <a href="https://www.reverie.lv" target="_blank" rel="noopener noreferrer">@reverie™</a>';

    const line6Plain = "building reverie™ technologies";
    const line6Html = 'building <a href="https://reverie.systems/" target="_blank" rel="noopener noreferrer">reverie™ technologies</a>';

    const line7Text = "Machine Hermeneutics as Artistic Practice";

    const line8Plain = "in | orcid | ig | yt | tiktok | email | call";
    const line8Html = `
      <a href="https://www.linkedin.com/in/martins-prieditis" target="_blank" rel="noopener noreferrer">in</a>
      |
      <a href="https://orcid.org/0009-0006-7257-5139" target="_blank" rel="noopener noreferrer">orcid</a>
      |
      <a href="https://www.instagram.com/martins.prieditis" target="_blank" rel="noopener noreferrer">ig</a>
      |
      <a href="https://www.youtube.com/@martinsprieditis" target="_blank" rel="noopener noreferrer">yt</a>
      |
      <a href="https://www.tiktok.com/@martins.prieditis" target="_blank" rel="noopener noreferrer">tiktok</a>
      |
      <a href="mailto:martins@prieditis.eu">email</a>
      |
      <a href="tel:+37126022841">call</a>
    `;

    const line1El = document.getElementById("line1");
    const line2El = document.getElementById("line2");
    const line3El = document.getElementById("line3");
    const line4El = document.getElementById("line4");
    const line5El = document.getElementById("line5");
    const line6El = document.getElementById("line6");
    const line7El = document.getElementById("line7");
    const line8El = document.getElementById("line8");

    const cursor = document.createElement("span");
    cursor.className = "cursor";

    const lines = [
      line1Text,
      line2Text,
      line3Text,
      line4Text,
      line5Plain,
      line6Plain,
      line7Text,
      line8Plain
    ];

    const totalChars = lines.reduce((sum, line) => sum + line.length, 0);

    let activeTarget = null;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function renderPartialLinkedText(container, fullPlain, fullHtml, count) {
      if (count <= 0) {
        container.innerHTML = "";
        return;
      }

      if (count >= fullPlain.length) {
        container.innerHTML = fullHtml;
        return;
      }

      container.textContent = fullPlain.slice(0, count);
    }

    function setCursorTarget(target) {
      activeTarget = target;
    }

    function mountCursor() {
      if (activeTarget && cursor.parentNode !== activeTarget) {
        activeTarget.appendChild(cursor);
      }
    }

    function updateTyping() {
      const introDelay = window.innerHeight * 0.12;
      const start = introDelay;
      const end = window.innerHeight * 0.88;

      let progress = (window.scrollY - start) / (end - start);
      progress = clamp(progress, 0, 1);

      const visibleChars = Math.floor(totalChars * progress);

      let remaining = visibleChars;

      const c1 = clamp(remaining, 0, line1Text.length);
      remaining -= c1;

      const c2 = clamp(remaining, 0, line2Text.length);
      remaining -= c2;

      const c3 = clamp(remaining, 0, line3Text.length);
      remaining -= c3;

      const c4 = clamp(remaining, 0, line4Text.length);
      remaining -= c4;

      const c5 = clamp(remaining, 0, line5Plain.length);
      remaining -= c5;

      const c6 = clamp(remaining, 0, line6Plain.length);
      remaining -= c6;

      const c7 = clamp(remaining, 0, line7Text.length);
      remaining -= c7;

      const c8 = clamp(remaining, 0, line8Plain.length);

      line1El.textContent = line1Text.slice(0, c1);
      line2El.textContent = line2Text.slice(0, c2);
      line3El.textContent = line3Text.slice(0, c3);
      line4El.textContent = line4Text.slice(0, c4);
      line7El.textContent = line7Text.slice(0, c7);

      renderPartialLinkedText(line5El, line5Plain, line5Html, c5);
      renderPartialLinkedText(line6El, line6Plain, line6Html, c6);
      renderPartialLinkedText(line8El, line8Plain, line8Html, c8);

      const b1 = line1Text.length;
      const b2 = b1 + line2Text.length;
      const b3 = b2 + line3Text.length;
      const b4 = b3 + line4Text.length;
      const b5 = b4 + line5Plain.length;
      const b6 = b5 + line6Plain.length;
      const b7 = b6 + line7Text.length;

      if (visibleChars < b1) {
        setCursorTarget(line1El);
      } else if (visibleChars < b2) {
        setCursorTarget(line2El);
      } else if (visibleChars < b3) {
        setCursorTarget(line3El);
      } else if (visibleChars < b4) {
        setCursorTarget(line4El);
      } else if (visibleChars < b5) {
        setCursorTarget(line5El);
      } else if (visibleChars < b6) {
        setCursorTarget(line6El);
      } else if (visibleChars < b7) {
        setCursorTarget(line7El);
      } else {
        setCursorTarget(line8El);
      }

      mountCursor();
    }

    setInterval(() => {
      cursor.classList.toggle("is-off");
    }, 530);

    window.addEventListener("scroll", updateTyping, { passive: true });
    window.addEventListener("resize", updateTyping);
    window.addEventListener("load", () => {
      setCursorTarget(line1El);
      mountCursor();
      updateTyping();
    });

    setCursorTarget(line1El);
    mountCursor();
  </script>

<style>
  .hero .typing-line {
    transform-origin: left center;
  }

  .hero.elastic-release .typing-line {
    will-change: transform;
    animation-name: elasticStringRelease;
    animation-duration: 820ms;
    animation-fill-mode: both;
    animation-timing-function: cubic-bezier(.22,.72,.18,1);
    animation-delay: var(--elastic-delay, 0ms);
  }

  @keyframes elasticStringRelease {
    0% {
      transform:
        scaleX(var(--elastic-start-scale, 1))
        skewX(var(--elastic-start-skew, 0deg));
    }

    16% {
      transform:
        scaleX(var(--elastic-burst-scale, 1.16))
        skewX(var(--elastic-burst-skew, -2deg));
    }

    31% {
      transform:
        scaleX(var(--elastic-recoil-scale, .94))
        skewX(var(--elastic-recoil-skew, 1.5deg));
    }

    45% {
      transform:
        scaleX(var(--elastic-second-scale, 1.07))
        skewX(var(--elastic-second-skew, -.9deg));
    }

    60% {
      transform:
        scaleX(var(--elastic-third-scale, .985))
        skewX(var(--elastic-third-skew, .35deg));
    }

    74% {
      transform:
        scaleX(var(--elastic-fourth-scale, 1.018))
        skewX(var(--elastic-fourth-skew, -.18deg));
    }

    100% {
      transform: scaleX(1) skewX(0deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero.elastic-release .typing-line {
      animation: none !important;
    }
  }
</style>

<script>
  const ENABLE_ELASTIC_SCROLL = true;

  const ELASTIC_TENSION_START = 0.935;
  const ELASTIC_RELEASE_AT = 0.985;
  const ELASTIC_REARM_BELOW = 0.915;
  const ELASTIC_RELEASE_MS = 900;

  if (ENABLE_ELASTIC_SCROLL) {
    const heroEl = document.querySelector(".hero");
    const elasticLines = Array.from(document.querySelectorAll(".hero .typing-line"));
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    /*
      All lines stay anchored to the same left edge.
      Only the text itself stretches/compresses, like a rubber sheet or string.
      Stronger values on the central identity lines create depth without
      sending rows in different directions.
    */
    const elasticStrength = [0.070, 0.085, 0.100, 0.115, 0.130, 0.145, 0.080, 0.055];
    const elasticSkew =     [0.7,   0.9,   1.1,   1.3,   1.5,   1.7,   0.8,   0.6];
    const elasticDelay =    [0,     8,     14,    5,     18,    10,    22,    16];

    let lastY = window.scrollY || 0;
    let lastTime = performance.now();
    let filteredVelocity = 0;

    let rafPending = false;
    let armed = true;
    let releasing = false;
    let tension = 0;

    function elasticClamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function elasticSmoothstep(v) {
      const x = elasticClamp(v, 0, 1);
      return x * x * (3 - 2 * x);
    }

    function getElasticScrollProgress() {
      const y = window.pageYOffset || window.scrollY || 0;
      const doc = document.documentElement;
      const body = document.body;

      const scrollHeight = Math.max(
        body.scrollHeight, doc.scrollHeight,
        body.offsetHeight, doc.offsetHeight,
        body.clientHeight, doc.clientHeight
      );

      const maxScroll = Math.max(1, scrollHeight - window.innerHeight);
      return elasticClamp(y / maxScroll, 0, 1);
    }

    function mobileFactor() {
      /*
        iPhone/mobile keeps the same elastic character, only slightly reduced
        so long lines do not become wider than the viewport.
      */
      return window.innerWidth <= 980 ? 0.78 : 1;
    }

    function clearElasticInline() {
      elasticLines.forEach((line) => {
        line.style.transform = "";
      });
    }

    function clearElasticVars() {
      elasticLines.forEach((line) => {
        [
          "--elastic-start-scale", "--elastic-start-skew",
          "--elastic-burst-scale", "--elastic-burst-skew",
          "--elastic-recoil-scale", "--elastic-recoil-skew",
          "--elastic-second-scale", "--elastic-second-skew",
          "--elastic-third-scale", "--elastic-third-skew",
          "--elastic-fourth-scale", "--elastic-fourth-skew",
          "--elastic-delay"
        ].forEach((prop) => line.style.removeProperty(prop));
      });
    }

    function applyElasticTension(value) {
      tension = value;

      if (reduceMotion.matches || releasing || value <= 0) {
        if (!releasing && value <= 0) clearElasticInline();
        return;
      }

      const factor = mobileFactor();

      elasticLines.forEach((line, index) => {
        const strength = (elasticStrength[index] ?? elasticStrength[elasticStrength.length - 1]) * factor;
        const skewStrength = (elasticSkew[index] ?? elasticSkew[elasticSkew.length - 1]) * factor;

        /*
          The line does not travel. It stays pinned on the left and stretches
          in X, creating the feeling of pulling a membrane/string.
        */
        const scale = 1 + strength * value;
        const skew = -skewStrength * value;

        line.style.transform =
          `scaleX(${scale.toFixed(4)}) skewX(${skew.toFixed(2)}deg)`;
      });
    }

    function setElasticReleaseVars(line, index, startTension, boost, factor) {
      const strength = (elasticStrength[index] ?? elasticStrength[elasticStrength.length - 1]) * factor;
      const skewStrength = (elasticSkew[index] ?? elasticSkew[elasticSkew.length - 1]) * factor;

      const startScale = 1 + strength * startTension;
      const startSkew = -skewStrength * startTension;

      /*
        Guaranteed pluck for slow scrolling + modest velocity boost for flicks.
        The recoil crosses through compression, then rings down like a string.
      */
      const burstScale = 1 + strength * 1.95 * boost;
      const burstSkew = -skewStrength * 1.45 * boost;

      const recoilScale = 1 - strength * 0.72;
      const recoilSkew = skewStrength * 0.85;

      const secondScale = 1 + strength * 0.72;
      const secondSkew = -skewStrength * 0.48;

      const thirdScale = 1 - strength * 0.19;
      const thirdSkew = skewStrength * 0.18;

      const fourthScale = 1 + strength * 0.16;
      const fourthSkew = -skewStrength * 0.08;

      const vars = {
        "--elastic-start-scale": startScale.toFixed(4),
        "--elastic-start-skew": `${startSkew.toFixed(2)}deg`,
        "--elastic-burst-scale": burstScale.toFixed(4),
        "--elastic-burst-skew": `${burstSkew.toFixed(2)}deg`,
        "--elastic-recoil-scale": recoilScale.toFixed(4),
        "--elastic-recoil-skew": `${recoilSkew.toFixed(2)}deg`,
        "--elastic-second-scale": secondScale.toFixed(4),
        "--elastic-second-skew": `${secondSkew.toFixed(2)}deg`,
        "--elastic-third-scale": thirdScale.toFixed(4),
        "--elastic-third-skew": `${thirdSkew.toFixed(2)}deg`,
        "--elastic-fourth-scale": fourthScale.toFixed(4),
        "--elastic-fourth-skew": `${fourthSkew.toFixed(2)}deg`,
        "--elastic-delay": `${elasticDelay[index] ?? 0}ms`
      };

      Object.entries(vars).forEach(([prop, value]) => {
        line.style.setProperty(prop, value);
      });
    }

    function triggerElasticRelease() {
      if (reduceMotion.matches || releasing) return;

      releasing = true;

      const speed = Math.abs(filteredVelocity);
      const velocityExtra = elasticClamp((speed - 0.15) / 2.4, 0, 1);
      const boost = 1 + velocityExtra * 0.22;
      const factor = mobileFactor();

      elasticLines.forEach((line, index) => {
        setElasticReleaseVars(
          line,
          index,
          Math.max(tension, 0.82),
          boost,
          factor
        );
      });

      heroEl.classList.remove("elastic-release");
      void heroEl.offsetWidth;

      /*
        Remove the direct pull and immediately let the animation start from the
        captured stretched state. This keeps the "pluck" continuous.
      */
      clearElasticInline();
      heroEl.classList.add("elastic-release");

      window.setTimeout(() => {
        heroEl.classList.remove("elastic-release");
        clearElasticVars();
        clearElasticInline();
        releasing = false;
      }, ELASTIC_RELEASE_MS);
    }

    function updateElasticPhysics() {
      rafPending = false;

      if (reduceMotion.matches) {
        heroEl.classList.remove("elastic-release");
        clearElasticInline();
        return;
      }

      const progress = getElasticScrollProgress();

      if (progress <= ELASTIC_REARM_BELOW) {
        armed = true;
      }

      if (!releasing) {
        if (!armed && progress >= ELASTIC_RELEASE_AT) {
          applyElasticTension(0);
        } else {
          const raw =
            (progress - ELASTIC_TENSION_START) /
            (ELASTIC_RELEASE_AT - ELASTIC_TENSION_START);

          applyElasticTension(elasticSmoothstep(raw));
        }
      }

      if (progress >= ELASTIC_RELEASE_AT && armed && !releasing) {
        triggerElasticRelease();
        armed = false;
      }
    }

    function onElasticScroll() {
      const now = performance.now();
      const y = window.scrollY || window.pageYOffset || 0;
      const dt = Math.max(8, now - lastTime);
      const rawVelocity = (y - lastY) / dt;

      filteredVelocity = filteredVelocity * 0.72 + rawVelocity * 0.28;

      lastY = y;
      lastTime = now;

      if (!rafPending) {
        rafPending = true;
        requestAnimationFrame(updateElasticPhysics);
      }
    }

    function onElasticResize() {
      if (!rafPending) {
        rafPending = true;
        requestAnimationFrame(updateElasticPhysics);
      }
    }

    if (reduceMotion.addEventListener) {
      reduceMotion.addEventListener("change", updateElasticPhysics);
    }

    window.addEventListener("scroll", onElasticScroll, { passive: true });
    window.addEventListener("resize", onElasticResize, { passive: true });
    window.addEventListener("load", updateElasticPhysics);

    updateElasticPhysics();
  }
</script>
